name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm audit --audit-level=high
      - run: npm publish --dry-run
